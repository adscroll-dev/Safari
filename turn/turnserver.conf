# VYRO TURN server — coturn configuration (v0.6).
#
# Free / open-source self-hosted TURN (coturn, BSD-licensed). No paid
# service, no account, no sign-up. Used only when the two call peers
# cannot reach each other directly (symmetric NATs); otherwise calls
# stay peer-to-peer via STUN.
#
# How it is used:
#   - Docker: see the `turn` service in the root docker-compose.yml.
#     The compose file mounts this file read-only and passes the
#     TURN user credential on the command line from $TURN_PASSWORD,
#     so no secret is baked into this file.
#   - Standalone: `turnserver -c turnserver.conf -u vyro:<password>`
#     (replace <password> with a strong secret; keep it out of git).
#
# TURN credentials are long-term (lt-cred-mech): the web client sends
# username `vyro` and the shared password from env vars
# NEXT_PUBLIC_TURN_USERNAME / NEXT_PUBLIC_TURN_CREDENTIAL. The
# password must match $TURN_PASSWORD used by the server.

# --- Network ---
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
# Relayed media uses this UDP port range (publish it in docker-compose).
min-port=49152
max-port=49200

# The address clients see in relay candidates. Inside Docker the
# container IP is useless to outside peers, so the compose file sets
# this from $TURN_EXTERNAL_IP (default 127.0.0.1 for local dev; set it
# to the server's public IP/DNS name in production). Leave commented
# here for standalone runs on a host with a public IP — coturn then
# auto-detects the external address.
#external-ip=127.0.0.1

# --- Auth ---
fingerprint
lt-cred-mech
realm=vyro.local
# No `user=` line here on purpose: the credential comes from the
# environment (compose command line / -u flag). See header.

# --- Behaviour ---
# No TLS by default: coturn needs a certificate for TLS (5349). For a
# public deployment terminate TLS with a real cert (e.g. Let's Encrypt)
# and add: cert=/path/to/fullchain.pem pkey=/path/to/privkey.pem
no-tls
# Keep relay allocations short-lived; clients refresh while in a call.
max-allocate-lifetime=3600
# Log to stdout/stderr so `docker compose logs turn` works.
log-file=stdout
simple-log
# Refuse multicast relay peers. (No `no-loopback-peers` here on purpose:
# local-dev peers sit on loopback, and the relay must reach them.)
