name: vyro
description: "VYRO — Connect Beyond Limits. Fast, secure, multi-platform messenger."
publish_to: "none"
version: 0.7.4+2006

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  flutter_localizations:
    sdk: flutter
  record: ^6.2.1
  just_audio: ^0.9.46
  # v0.6 mobile parity: audited-primitive crypto for E2EE (X25519 /
  # Ed25519 / AES-256-GCM / HKDF), pure-Dart image compression for
  # Data Saver uploads, photo picking for stories, usage-meter
  # persistence, and WebRTC for low-bitrate voice/video calls.
  cryptography: ^2.7.0
  image: ^4.5.4
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  flutter_webrtc: ^0.12.5
  video_player: ^2.9.5
  path_provider: ^2.1.5
  # FCM push (Firebase Cloud Messaging): the app registers its device
  # token with the backend after login so the server can wake it when a
  # message arrives while it is closed. google-services.json (Android)
  # is already in android/app/; see lib/fcm_push.dart.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.0
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter

# VYRO fork of flutter_webrtc (Android only, in plugins/flutter_webrtc):
# no released version implements the SurfaceProducer.Callback shape of
# Flutter 3.24.5's embedding ({onSurfaceCreated, onSurfaceDestroyed}),
# so the stock plugin does not compile. See
# plugins/flutter_webrtc/FORK_README.md. Remove this override when
# upgrading to a Flutter whose engine uses the newer Callback shape.
dependency_overrides:
  flutter_webrtc:
    path: plugins/flutter_webrtc

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
    - assets/safari-logo.png
    - assets/safari-logo-transparent.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn.ttf
