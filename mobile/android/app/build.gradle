plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Dependency alignment: the local Maven repo has no Gradle Module
// Metadata (.module files), so Gradle resolves Kotlin multiplatform
// libraries from poms alone and pulls BOTH the -android and -jvm
// variants (whose classes duplicate each other), and old transitive
// pins (activity-ktx 1.5.1, lifecycle-runtime-ktx 2.5.1) bundle classes
// that moved into newer artifacts. Without this, the release build
// fails at :app:checkReleaseDuplicateClasses.
configurations.all {
    resolutionStrategy {
        // activity-ktx 1.9.3 is an (almost) empty shell; the classes
        // live in activity 1.9.3. Forcing it drops the 1.5.1 duplicates.
        force 'androidx.activity:activity-ktx:1.9.3'
        // lifecycle-runtime-ktx 2.7.0 no longer bundles the classes
        // that moved into lifecycle-common 2.7.0.
        force 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    }
    // On Android only the -android datastore-core variant belongs: the
    // pom-only resolution also pulls datastore-core-jvm, whose 103
    // classes duplicate datastore-core-android's. (Do NOT exclude the
    // -okio-jvm / -preferences-core-jvm variants: the common jars carry
    // no classes, so the -jvm jars are the only copies of the Okio and
    // Preferences implementations that shared_preferences needs.)
    exclude group: 'androidx.datastore', module: 'datastore-core-jvm'
    // NOTE: do NOT exclude androidx.annotation:annotation-jvm — the
    // main annotation jar is Kotlin-multiplatform metadata with no
    // classes; the -jvm artifact is where Keep/NonNull actually live
    // when Gradle resolves from poms alone. Its duplicate LICENSE.txt
    // is handled by the packagingOptions excludes below.
}

android {
    namespace = "app.vyro"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "app.vyro"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // minSdk 23 (not Flutter's default 21): the record_android plugin
        // declares minSdk 23, and the manifest merger fails otherwise.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    packagingOptions {
        resources {
            // Kotlin/Native linkdata files ship inside several datastore
            // jars; they are not needed at runtime on Android, and
            // pom-only resolution pulls in both copies, which fails the
            // resource merge with a duplicate-file error.
            excludes += 'nativeMain/default/linkdata/**'
            // Kotlin-multiplatform metadata (manifests, linkdata) is
            // bundled identically into several metadata-only jars
            // (annotation, datastore-*); it is build-time only and
            // must not be packaged.
            excludes += 'commonMain/**'
            excludes += 'nonJvmMain/**'
            excludes += 'nativeMain/**'
            // Same three metadata-only jars also share this file.
            excludes += 'META-INF/kotlin-project-structure-metadata.json'
            // License/notice files are duplicated across the -android
            // and -jvm variants of multiplatform libraries.
            excludes += 'META-INF/**/LICENSE.txt'
            excludes += 'META-INF/**/LICENSE'
            excludes += 'META-INF/**/NOTICE'
            excludes += 'META-INF/**/NOTICE.txt'
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
